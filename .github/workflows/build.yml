name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project v2.2
        run: |
          rm -rf android_project
          mkdir -p android_project
          unzip -o BlockBlastLiveHelper_Revised_v2.2.zip -d android_project

      - name: Check project structure
        working-directory: android_project
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP ==="
          ls -la app
          echo "=== KOTLIN FILES ==="
          find app/src/main/kotlin -type f -name "*.kt" -print

      - name: Build Debug APK
        working-directory: android_project
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== GENERATED APK ==="
          find android_project/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastLiveHelper-v2.2
          path: android_project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
