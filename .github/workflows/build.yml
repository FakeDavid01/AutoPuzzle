name: Build Block Blast Live Helper

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract v2.4 project
        run: |
          rm -rf android_project
          mkdir android_project
          unzip -q BlockBlastLiveHelper_Revised_v2.4.zip -d android_project

          if [ -d "android_project/android_project" ]; then
            shopt -s dotglob
            mv android_project/android_project/* android_project/
            rm -rf android_project/android_project
          fi

          echo "=== Project structure ==="
          find android_project -maxdepth 3 -type f | sort

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        working-directory: android_project
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastLiveHelper-v2.4
          path: android_project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
